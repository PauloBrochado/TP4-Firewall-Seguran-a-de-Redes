# TP4 - Firewall programavel - topologia do laboratorio
#
#   cliente  (10.44.10.10) --+                                    +-- servidor (10.44.30.10)
#                            +-- lan-clientes -- firewall -- lan-servidores
#   atacante (10.44.10.20) --+   10.44.10.0/24   .254 / .254   10.44.30.0/24
#
# As duas redes sao "internal": nao tem saida para fora da VM.
# Cada host usa a firewall (.254) como rota por omissao, por isso o trafego
# entre as duas redes e obrigado a passar por ela.

version: "3.7"     # 3.7 e necessario para a opcao "init"

services:
  cliente:
    image: handsonsecurity/seed-ubuntu:large
    container_name: tp4-cliente
    hostname: cliente
    tty: true
    cap_add:
      - NET_ADMIN          # para alterar a rota por omissao
    networks:
      lan-clientes:
        ipv4_address: 10.44.10.10
    command: bash -c "
        ip route replace default via 10.44.10.254 &&
        tail -f /dev/null
      "

  atacante:
    image: handsonsecurity/seed-ubuntu:large
    container_name: tp4-atacante
    hostname: atacante
    tty: true
    cap_add:
      - NET_ADMIN          # alterar rotas
      - NET_RAW            # Scapy precisa de raw sockets para forjar pacotes
    volumes:
      - ./ataques:/ataques
    networks:
      lan-clientes:
        ipv4_address: 10.44.10.20
    command: bash -c "
        ip route replace default via 10.44.10.254 &&
        tail -f /dev/null
      "

  firewall:
    build: ./firewall      # imagem SEED + NetfilterQueue (ver firewall/Dockerfile)
    image: tp4-firewall
    container_name: tp4-firewall
    hostname: firewall
    tty: true
    cap_add:
      - NET_ADMIN          # iptables, NFQUEUE e encaminhamento
      - NET_RAW            # tcpdump e Scapy
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./firewall:/app    # codigo da firewall (editar no host, sem rebuild)
      - ./logs:/logs       # eventos JSON
    networks:
      lan-clientes:
        ipv4_address: 10.44.10.254
      lan-servidores:
        ipv4_address: 10.44.30.254
    init: true             # PID 1 e um mini-init, o Python passa a receber sinais (pkill)
    command: bash /app/start.sh   # regra NFQUEUE + firewall.py com reinicio automatico

  servidor:
    image: handsonsecurity/seed-ubuntu:large
    container_name: tp4-servidor
    hostname: servidor
    tty: true
    cap_add:
      - NET_ADMIN          # para alterar a rota por omissao
    networks:
      lan-servidores:
        ipv4_address: 10.44.30.10
    command: bash -c "
        ip route replace default via 10.44.30.254 &&
        /etc/init.d/openbsd-inetd start &&
        mkdir -p /www && echo 'TP4 servidor OK' > /www/index.html &&
        cd /www && python3 -m http.server 80
      "

networks:
  lan-clientes:
    name: tp4-lan-clientes
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-tp4-cli
    ipam:
      config:
        - subnet: 10.44.10.0/24

  lan-servidores:
    name: tp4-lan-servidores
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-tp4-srv
    ipam:
      config:
        - subnet: 10.44.30.0/24
